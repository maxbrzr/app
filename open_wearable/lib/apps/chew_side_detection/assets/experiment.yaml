experiment_name: "Chewing Side Detection Experiment"

global_sensor_configs:
  - sensor: pressure
    sample_rate: 100
  - sensor: microphone
    sample_rate: 48000
  - sensor: ppg
    sample_rate: 400
  - sensor: bone_conduction
    sample_rate: 1600
  - sensor: imu
    sample_rate: 100
  - sensor: temperature
    sample_rate: 8

blocks:
  - block_number: 0
    instruction: "Please agree to the consent form."
  - block_number: 1
    instruction: "Please execute the indicated task."
    tasks:
      - name: "Sit still"
        duration: 30
      - name: "Drink"
        duration: 30
      - name: "Move your head"
        duration: 30
      - name: "Perform facial expressions"
        duration: 30
      - name: "Read aloud"
        duration: 30
  - block_number: 2
    instruction: "Please chew the indicated food on the indicated side."
    tasks:
      - name: "Nut Mix"
        duration: 30
      - name: "Salt Pretzels"
        duration: 30
      - name: "Potato Chips"
        duration: 30
      - name: "Apple"
        duration: 30
      - name: "Chewing Gum"
        duration: 30
      - name: "Banana"
        duration: 30
      - name: "Lettuce"
        duration: 30
      - name: "Bread"
        duration: 30
      - name: "Cheese"
        duration: 30
      - name: "Gummy Bears"
        duration: 30
  - block_number: 3
    instruction: "Please chew the indicated food on the indicated side while listening to a sound."
    tasks:
      - name: "Salt Pretzels with pop chart music."
        duration: 30
      - name: "Salt Pretzels with dining hall ambience."
        duration: 30
      - name: "Salt Pretzels with construction noise."
        duration: 30
      - name: "Cheese with pop chart music."
        duration: 30
      - name: "Cheese with dining hall ambience."
        duration: 30
      - name: "Cheese with construction noise."
        duration: 30
  - block_number: 4
    instruction: "Please chew the indicated food on the indicated side."
    tasks:
      - name: "Bowl"
        duration: 30
      - name: "Bowl"
        duration: 30
      - name: "Bowl"
        duration: 30
  - block_number: 5
    instruction: "Please answer the questionnaire."