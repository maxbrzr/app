experiment_name: "Chewing Side Detection Experiment"

global_sensor_configs:
  - sensor: pressure
    sample_rate: 100
  - sensor: microphone
    sample_rate: 48000
  - sensor: ppg
    sample_rate: 50
  - sensor: bone_conduction
    sample_rate: 1600
  - sensor: imu
    sample_rate: 100
  - sensor: temperature
    sample_rate: 8

blocks:
  - block_number: 0
    instruction: "Please agree to the consent form."
  - block_number: 1
    instruction: "Please execute the indicated task."
    tasks:
      - id: still
        name: "Sit still"
        duration: 30
      - id: drink
        name: "Drink"
        duration: 30
      - id: head
        name: "Move your head"
        duration: 30
      - id: face
        name: "Perform facial expressions"
        duration: 30
      - id: read
        name: "Read aloud"
        duration: 30
  - block_number: 2
    instruction: "Please chew the indicated food on the indicated side."
    tasks:
      - id: nuts
        name: "Nut mix"
        duration: 30
      - id: pretzels
        name: "Salt pretzels"
        duration: 30
      - id: chips
        name: "Potato chips"
        duration: 30
      - id: apple
        name: "Apple"
        duration: 30
      - id: gum
        name: "Chewing gum"
        duration: 30
      - id: banana
        name: "Banana"
        duration: 30
      - id: lettuce
        name: "Lettuce"
        duration: 30
      - id: bread
        name: "Bread"
        duration: 30
      - id: cheese
        name: "Cheese"
        duration: 30
      - id: gummies
        name: "Gummy bears"
        duration: 30
  - block_number: 3
    instruction: "Please chew the indicated food on the indicated side while listening."
    tasks:
      - id: pretzels-music
        name: "Salt pretzels with pop music"
        duration: 30
      - id: pretzels-dining
        name: "Salt pretzels with dining hall ambience"
        duration: 30
      - id: pretzels-construction
        name: "Salt pretzels with construction noise"
        duration: 30
      - id: cheese-music
        name: "Cheese with pop music"
        duration: 30
      - id: cheese-dining
        name: "Cheese with dining hall ambience"
        duration: 30
      - id: cheese-construction
        name: "Cheese with construction noise"
        duration: 30
  - block_number: 4
    instruction: "Please chew the indicated food on the indicated side."
    tasks:
      - id: bowl-1
        name: "Bowl"
        duration: 30
      - id: bowl-2
        name: "Bowl"
        duration: 30
      - id: bowl-3
        name: "Bowl"
        duration: 30
  - block_number: 5
    instruction: "Please answer the questionnaire."