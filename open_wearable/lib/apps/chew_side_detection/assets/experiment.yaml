experiment_name: "Chewing Side Detection Experiment"

global_sensor_configs:
  - sensor: pressure
    sample_rate: 100
  - sensor: microphone
    sample_rate: 48000
  - sensor: ppg
    sample_rate: 50
  - sensor: bone_conduction
    sample_rate: 1600
  - sensor: imu
    sample_rate: 100
  - sensor: temperature
    sample_rate: 8

blocks:
  - block_number: 0
    instruction: "Please agree to the consent form."
  - block_number: 1
    instruction: "Please execute the indicated task."
    tasks:
      - id: sit-still
        name: "Sit still"
        duration: 30
      - id: drink
        name: "Drink"
        duration: 30
      - id: move-head
        name: "Move your head"
        duration: 30
      - id: facial-expressions
        name: "Perform facial expressions"
        duration: 30
      - id: read-aloud
        name: "Read aloud"
        duration: 30
  - block_number: 2
    instruction: "Please chew the indicated food on the indicated side."
    tasks:
      - id: nut-mix
        name: "Nut Mix"
        duration: 30
      - id: salt-pretzels
        name: "Salt Pretzels"
        duration: 30
      - id: potato-chips
        name: "Potato Chips"
        duration: 30
      - id: apple
        name: "Apple"
        duration: 30
      - id: chewing-gum
        name: "Chewing Gum"
        duration: 30
      - id: banana
        name: "Banana"
        duration: 30
      - id: lettuce
        name: "Lettuce"
        duration: 30
      - id: bread
        name: "Bread"
        duration: 30
      - id: cheese
        name: "Cheese"
        duration: 30
      - id: gummy-bears
        name: "Gummy Bears"
        duration: 30
  - block_number: 3
    instruction: "Please chew the indicated food on the indicated side while listening to a sound."
    tasks:
      - id: salt-pretzels-pop-music
        name: "Salt Pretzels with pop chart music."
        duration: 30
      - id: salt-pretzels-dining-ambience
        name: "Salt Pretzels with dining hall ambience."
        duration: 30
      - id: salt-pretzels-construction-noise
        name: "Salt Pretzels with construction noise."
        duration: 30
      - id: cheese-pop-music
        name: "Cheese with pop chart music."
        duration: 30
      - id: cheese-dining-ambience
        name: "Cheese with dining hall ambience."
        duration: 30
      - id: cheese-construction-noise
        name: "Cheese with construction noise."
        duration: 30
  - block_number: 4
    instruction: "Please chew the indicated food on the indicated side."
    tasks:
      - id: bowl-1
        name: "Bowl"
        duration: 30
      - id: bowl-2
        name: "Bowl"
        duration: 30
      - id: bowl-3
        name: "Bowl"
        duration: 30
  - block_number: 5
    instruction: "Please answer the questionnaire."