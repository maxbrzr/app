experiment_name: "Chewing Side Detection Experiment"

global_sensor_configs:
  - sensor: pressure
    sample_rate: 200
  - sensor: microphone
    sample_rate: 48000
  - sensor: ppg
    sample_rate: 400
  - sensor: bone_conduction
    sample_rate: 1600
  - sensor: imu
    sample_rate: 800
  - sensor: temperature
    sample_rate: 200

