experiment_name: "Chewing Side Detection Experiment"

global_sensor_configs:
  - sensor: pressure
    sample_rate: 100
  - sensor: microphone
    sample_rate: 48000
  - sensor: ppg
    sample_rate: 400
  - sensor: bone_conduction
    sample_rate: 1600
  - sensor: imu
    sample_rate: 100
  - sensor: temperature
    sample_rate: 8

blocks:
  - block_number: 0
    instruction: "Please agree to the consent form."
  - block_number: 1
    instruction: "Please wear the device and execute the shown tasks."
    tasks:
      - id: "sit-still"
        name: "Sit still"
        duration: 1
  - block_number: 2
    instruction: "Please wear the device and chew the given food on the indicated side."
    tasks:
      - id: "nut-mix"
        name: "Nut Mix"
        duration: 1
  - block_number: 3
    instruction: "Please wear the device and chew the given food on the indicated side while listening to a sound."
    tasks:
      - id: "salted-pretzels-music"
        name: "Salted Pretzels with music"
        duration: 1
  - block_number: 4
    instruction: "Please wear the device and chew the given food on the indicated site."
    tasks:
      - id: "bowl"
        name: "Bowl"
        duration: 1
  - block_number: 5
    instruction: "Please answer the questionnaire."